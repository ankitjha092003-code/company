<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Hospital bed and patient-care equipment in a clean home-care environment">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEBF8"/>
      <stop offset="1" stop-color="#CBE0F0"/>
    </linearGradient>
  </defs>

  <!-- Room -->
  <rect width="640" height="560" fill="url(#wall2)"/>
  <rect y="396" width="640" height="164" fill="url(#floor2)"/>
  <rect y="388" width="640" height="10" fill="#1677C8" opacity="0.15"/>
  <circle cx="72" cy="80" r="30" fill="#20A464" opacity="0.12"/>

  <!-- Wall cross accent -->
  <g transform="translate(560,90)" opacity="0.9">
    <rect x="-9" y="-30" width="18" height="60" rx="6" fill="#1677C8" opacity="0.2"/>
    <rect x="-30" y="-9" width="60" height="18" rx="6" fill="#1677C8" opacity="0.2"/>
  </g>

  <!-- Window -->
  <rect x="60" y="150" width="150" height="120" rx="12" fill="#FFFFFF" stroke="#C9DCEC" stroke-width="5"/>
  <line x1="135" y1="150" x2="135" y2="270" stroke="#C9DCEC" stroke-width="4"/>
  <line x1="60" y1="210" x2="210" y2="210" stroke="#C9DCEC" stroke-width="4"/>
  <path d="M60 250 L108 196 L156 250 L210 214 L210 270 L60 270 Z" fill="#1677C8" opacity="0.12"/>

  <!-- Hospital bed (center-right) -->
  <g>
    <ellipse cx="330" cy="456" rx="200" ry="14" fill="#0B2341" opacity="0.10"/>
    <rect x="150" y="250" width="14" height="130" rx="7" fill="#1677C8"/>
    <path d="M168 326 L192 326 L214 276 L198 266 Z" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3" stroke-linejoin="round"/>
    <rect x="164" y="322" width="304" height="42" rx="13" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3"/>
    <rect x="164" y="354" width="304" height="9" rx="4.5" fill="#167C8" opacity="0.30"/>
    <rect x="164" y="354" width="304" height="9" rx="4.5" fill="#1677C8" opacity="0.30"/>
    <rect x="172" y="308" width="46" height="18" rx="9" fill="#EAF6FF" stroke="#C9DCEC" stroke-width="2.5"/>
    <rect x="256" y="308" width="124" height="9" rx="4.5" fill="#1677C8" opacity="0.55"/>
    <rect x="267" y="313" width="6" height="13" fill="#1677C8" opacity="0.55"/>
    <rect x="358" y="313" width="6" height="13" fill="#1677C8" opacity="0.55"/>
    <rect x="168" y="364" width="296" height="13" rx="6.5" fill="#0B2341" opacity="0.9"/>
    <rect x="196" y="377" width="11" height="42" fill="#0B2341" opacity="0.85"/>
    <rect x="428" y="377" width="11" height="42" fill="#0B2341" opacity="0.85"/>
    <rect x="460" y="286" width="15" height="94" rx="7.5" fill="#1677C8"/>
    <circle cx="204" cy="432" r="17" fill="#0B2341"/>
    <circle cx="204" cy="432" r="5.5" fill="#EAF6FF"/>
    <circle cx="434" cy="432" r="17" fill="#0B2341"/>
    <circle cx="434" cy="432" r="5.5" fill="#EAF6FF"/>
  </g>

  <!-- Walker (far right) -->
  <g>
    <ellipse cx="576" cy="452" rx="52" ry="7" fill="#0B2341" opacity="0.10"/>
    <path d="M548 412 L548 352 Q548 344 556 344 L600 344 Q608 344 608 352 L608 412"
          fill="none" stroke="#1677C8" stroke-width="10" stroke-linecap="round"/>
    <rect x="540" y="334" width="76" height="14" rx="7" fill="#0B2341"/>
    <circle cx="552" cy="422" r="10" fill="#0B2341"/>
    <circle cx="552" cy="422" r="3.5" fill="#EAF6FF"/>
    <circle cx="604" cy="422" r="10" fill="#0B2341"/>
    <circle cx="604" cy="422" r="3.5" fill="#EAF6FF"/>
  </g>

  <!-- Bedside locker with plant -->
  <g>
    <rect x="52" y="356" width="64" height="88" rx="10" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="4"/>
    <line x1="52" y1="388" x2="116" y2="388" stroke="#A8C6E0" stroke-width="3"/>
    <rect x="72" y="364" width="24" height="6" rx="3" fill="#1677C8" opacity="0.6"/>
    <path d="M84 320 L84 340 M84 330 L72 322 M84 330 L96 322" stroke="#20A464" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="76" y="340" width="16" height="14" rx="3" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3"/>
  </g>
</svg>
