<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Hospital bed and wheelchair in a home-care room">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEBF8"/>
      <stop offset="1" stop-color="#CBE0F0"/>
    </linearGradient>
  </defs>

  <!-- Room -->
  <rect width="640" height="520" fill="url(#wall)"/>
  <rect y="360" width="640" height="160" fill="url(#floor)"/>
  <rect y="352" width="640" height="10" fill="#1677C8" opacity="0.15"/>
  <circle cx="560" cy="70" r="26" fill="#20A464" opacity="0.12"/>
  <circle cx="60" cy="330" r="40" fill="#1677C8" opacity="0.08"/>

  <!-- Window -->
  <rect x="452" y="52" width="140" height="120" rx="12" fill="#FFFFFF" stroke="#C9DCEC" stroke-width="5"/>
  <line x1="522" y1="52" x2="522" y2="172" stroke="#C9DCEC" stroke-width="4"/>
  <line x1="452" y1="112" x2="592" y2="112" stroke="#C9DCEC" stroke-width="4"/>
  <path d="M452 150 L500 100 L548 150 L592 116 L592 172 L452 172 Z" fill="#1677C8" opacity="0.12"/>

  <!-- Wall cross accent -->
  <g transform="translate(120,70)" opacity="0.9">
    <rect x="-9" y="-30" width="18" height="60" rx="6" fill="#1677C8" opacity="0.2"/>
    <rect x="-30" y="-9" width="60" height="18" rx="6" fill="#1677C8" opacity="0.2"/>
  </g>

  <!-- Hospital bed (left) -->
  <g>
    <ellipse cx="230" cy="420" rx="190" ry="14" fill="#0B2341" opacity="0.10"/>
    <rect x="70" y="216" width="14" height="120" rx="7" fill="#1677C8"/>
    <path d="M88 292 L112 292 L134 244 L118 234 Z" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3" stroke-linejoin="round"/>
    <rect x="84" y="288" width="288" height="40" rx="13" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3"/>
    <rect x="84" y="318" width="288" height="9" rx="4.5" fill="#1677C8" opacity="0.30"/>
    <rect x="92" y="274" width="46" height="18" rx="9" fill="#EAF6FF" stroke="#C9DCEC" stroke-width="2.5"/>
    <rect x="172" y="274" width="120" height="9" rx="4.5" fill="#1677C8" opacity="0.55"/>
    <rect x="183" y="279" width="6" height="13" fill="#1677C8" opacity="0.55"/>
    <rect x="272" y="279" width="6" height="13" fill="#1677C8" opacity="0.55"/>
    <rect x="88" y="328" width="280" height="13" rx="6.5" fill="#0B2341" opacity="0.9"/>
    <rect x="114" y="341" width="11" height="40" fill="#0B2341" opacity="0.85"/>
    <rect x="340" y="341" width="11" height="40" fill="#0B2341" opacity="0.85"/>
    <rect x="372" y="252" width="15" height="89" rx="7.5" fill="#1677C8"/>
    <circle cx="122" cy="396" r="17" fill="#0B2341"/>
    <circle cx="122" cy="396" r="5.5" fill="#EAF6FF"/>
    <circle cx="348" cy="396" r="17" fill="#0B2341"/>
    <circle cx="348" cy="396" r="5.5" fill="#EAF6FF"/>
  </g>

  <!-- Wheelchair (right) -->
  <g>
    <ellipse cx="496" cy="426" rx="90" ry="10" fill="#0B2341" opacity="0.10"/>
    <circle cx="468" cy="352" r="52" fill="none" stroke="#0B2341" stroke-width="8"/>
    <circle cx="468" cy="352" r="52" fill="none" stroke="#1677C8" stroke-width="8" stroke-dasharray="12 62" stroke-linecap="round"/>
    <circle cx="468" cy="352" r="7" fill="#0B2341"/>
    <circle cx="468" cy="300" r="16" fill="none" stroke="#0B2341" stroke-width="8"/>
    <rect x="452" y="340" width="92" height="18" rx="9" fill="#1677C8"/>
    <rect x="466" y="288" width="72" height="16" rx="8" fill="#1677C8"/>
    <path d="M534 290 L534 332" stroke="#1677C8" stroke-width="12" stroke-linecap="round"/>
    <path d="M468 300 C496 304 514 320 524 338" stroke="#1677C8" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M540 372 L554 406" stroke="#0B2341" stroke-width="8" stroke-linecap="round"/>
    <path d="M554 406 L532 406" stroke="#0B2341" stroke-width="8" stroke-linecap="round"/>
    <circle cx="526" cy="406" r="11" fill="#0B2341"/>
    <circle cx="526" cy="406" r="4" fill="#EAF6FF"/>
  </g>

  <!-- Small bedside plant -->
  <g>
    <path d="M612 336 L612 360 M612 348 L600 340 M612 348 L624 340" stroke="#20A464" stroke-width="5" stroke-linecap="round"/>
    <rect x="602" y="360" width="20" height="18" rx="4" fill="#FFFFFF" stroke="#A8C6E0" stroke-width="3"/>
  </g>
</svg>
